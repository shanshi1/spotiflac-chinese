name: Build unofficial Simplified Chinese APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chinese-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPOTIFLAC_DISCORD_SDK: "0"
      SPOTIFLAC_RUST_ANDROID_ABIS: arm64-v8a
      # Bindgen is a build tool; avoid large unused debug/incremental files on CI.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Free disk space for Android and Rust builds
        run: |
          df -h /
          # The first build exhausted the hosted runner while compiling bindgen.
          # Keep Java, Flutter, Android SDK and the Rust toolchains unchanged.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/swift /opt/hostedtoolcache/CodeQL /opt/az /opt/google /opt/microsoft
          for ndk in "$ANDROID_HOME"/ndk/*; do
            case "$(basename "$ndk")" in
              29.0.14206865|28.2.13676358) ;;
              *) sudo rm -rf "$ndk" ;;
            esac
          done
          df -h /
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: "9.8.0"
          gradle-home-cache-includes: |
            caches/modules-2
            notifications
      - name: Install Android and native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev ffmpeg
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          cd rust_backend
          rustup show
      - name: Validate and generate Chinese localization
        run: |
          python3 scripts/validate_chinese_translation.py
          flutter pub get
          flutter gen-l10n
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
      - name: Build ARM64 Lite APK
        run: bash scripts/build_android.sh --lite --target lib/main.dart
      - name: Verify APK and package build artifact
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          python3 scripts/check_backend_apk.py "$apk" --backend rust --abis arm64-v8a
          mkdir -p build/chinese-delivery
          cp "$apk" build/chinese-delivery/SpotiFLAC-5.1.0-zh-arm64.apk
          sha256sum build/chinese-delivery/SpotiFLAC-5.1.0-zh-arm64.apk > build/chinese-delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SpotiFLAC-5.1.0-zh-arm64
          path: build/chinese-delivery/
          retention-days: 14
